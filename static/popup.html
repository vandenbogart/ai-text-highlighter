<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 240px; margin: 12px; font: 13px/1.4 system-ui, sans-serif; }
      label { display: flex; justify-content: space-between; font-weight: 600; }
      input { width: 100%; }
      p { margin: 8px 0 0; color: #555; }
    </style>
  </head>
  <body>
    <label for="threshold">Highlight threshold <output id="value"></output></label>
    <input id="threshold" type="range" min="0" max="1" step="0.05" />
    <p>Scores come from a local model and are estimates, not proof of authorship.</p>
    <p id="status"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
